<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no, minimum-scale=1, maximum-scale=1"
    />
    <title>JS Engine</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        height: 100%;
      }
      canvas {
        width: round(down, min(100vw, 100vh), 160px);
        height: 100%;
        image-rendering: pixelated;
      }
      #app {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      @media (any-pointer: coarse) {
        html {
          background-color: yellow;
        }
      }
      @media (any-pointer: coarse) and (orientation: landscape) {
        canvas {
          width: auto;
          height: round(down, min(100vw, 100vh), 144px);
        }
        #app {
          height: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
