<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no, minimum-scale=1, maximum-scale=1"
    />
    <title>JS Engine</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        height: 100%;
      }
      canvas {
        width: round(down, min(100svw, 100svh), 160px);
        height: 100%;
        image-rendering: pixelated;
      }
      #app {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .gamepad {
        display: none;
        position: absolute;
        width: 100svw;
        height: 100svh;
        top: 0;
        left: 0;
      }
      .button {
        background: none;
        color: white;
        border: 2px solid white;
        position: absolute;
        opacity: 0.8;
      }
      .button--round {
        font-size: min(8svw, 8svh);
        width: min(14svw, 14svh);
        height: min(14svw, 14svh);
        border-radius: 50%;
      }
      .button--a {
        bottom: min(10svw, 10svh);
        right: min(5svw, 5svh);
      }
      .button--b {
        bottom: min(5svw, 5svh);
        right: min(25svw, 25svh);
      }
      .button--dpad {
        width: min(30svw, 30svh);
        height: min(30svw, 30svh);
        bottom: min(5svw, 5svh);
        left: min(5svw, 5svh);
      }
      @media (any-pointer: coarse) {
        html {
          background-color: yellow;
        }
        .gamepad {
          display: block;
        }
      }
      @media (any-pointer: coarse) and (orientation: landscape) {
        canvas {
          width: auto;
          height: round(down, min(100svw, 100svh), 144px);
        }
        #app {
          height: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="gamepad">
      <button class="button button--round button--a" data-btn="KeyZ">A</button>
      <button class="button button--round button--b" data-btn="KeyX">B</button>
      <button class="button button--dpad" data-dpad></button>
    </div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
